
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Text Expander</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1f2937;
      --input: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f3f4f6;
      --panel: #ffffff;
      --input: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    body {
      width: 360px;
      height: 560px;
      max-height: 560px;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.danger {
      color: var(--danger);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      flex: 1;
    }

    .tab.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* Kısayollar sekmesi: sabit form ve bağımsız kaydırılan liste */
    #shortcuts.panel.active {
      display: flex;
      flex-direction: column;
      height: 440px;
      min-height: 0;
    }

    .shortcut-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
      margin: 0 0 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }

    .shortcut-info {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .shortcut-trigger {
      display: block;
      color: var(--accent);
      font-weight: 700;
    }

    .shortcut-preview {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .item-actions {
      display: flex;
      flex-shrink: 0;
      gap: 4px;
    }

    .item-actions button {
      padding: 5px 7px;
      font-size: 12px;
    }

    #shortcutForm {
      flex-shrink: 0;
      padding-top: 2px;
    }

    #formTitle {
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--input);
      color: var(--text);
    }

    textarea {
      min-height: 65px;
      max-height: 90px;
      resize: vertical;
    }

    .form-actions,
    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .form-actions button,
    .settings-actions button {
      flex: 1;
    }

    .empty {
      padding: 18px 8px;
      color: var(--muted);
      text-align: center;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .setting-row > * {
      flex: 1;
      min-width: 0;
    }

    .setting-description,
    .muted,
    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .setting-description {
      margin: 6px 0 14px;
    }

    .status {
      min-height: 16px;
      margin-top: 5px;
    }

    hr {
      margin: 16px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    #settings.panel.active {
      height: 440px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <h1>Private Text Expander</h1>

  <div class="tabs">
    <button class="tab active" data-tab="shortcuts">Kısayollar</button>
    <button class="tab" data-tab="settings">Ayarlar</button>
  </div>

  <section id="shortcuts" class="panel active">
    <div id="shortcutList" class="shortcut-list"></div>

    <h2 id="formTitle">Yeni kısayol</h2>

    <form id="shortcutForm">
      <div class="field">
        <label for="trigger">Tetikleyici</label>
        <input
          id="trigger"
          type="text"
          placeholder=":mail"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="replacement">Genişletilecek metin</label>
        <textarea
          id="replacement"
          placeholder="Buraya metninizi yazın..."
          required
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="primary" id="saveShortcut">
          Kaydet
        </button>
        <button type="button" id="cancelEdit" hidden>
          İptal
        </button>
      </div>
    </form>

    <div id="shortcutStatus" class="status" role="status"></div>
  </section>

  <section id="settings" class="panel">
    <h2>Genel ayarlar</h2>

    <div class="field">
      <label for="triggerPrefix">Tetikleyici öneki</label>

      <div class="setting-row">
        <input
          id="triggerPrefix"
          type="text"
          maxlength="5"
          placeholder=":"
          autocomplete="off"
        >
        <button type="button" class="primary" id="saveTriggerPrefix">
          Kaydet
        </button>
      </div>

      <p class="setting-description">
        Kısayollar bu önekle başlar. Örnek: :mail, ;mail veya //mail.
        Boşluk kullanmayın.
      </p>
    </div>

    <div class="field">
      <label for="theme">Görünüm</label>
      <select id="theme">
        <option value="dark">Koyu</option>
        <option value="light">Açık</option>
      </select>
    </div>

    <hr>

    <h2>Yedekleme</h2>

    <p class="setting-description">
      Kısayollarınızı JSON dosyasına aktarabilir veya daha önce aldığınız
      bir yedeği içe aktarabilirsiniz.
    </p>

    <div class="settings-actions">
      <button type="button" id="exportData">Dışa aktar</button>
      <button type="button" id="importData">İçe aktar</button>
      <input
        id="importFile"
        type="file"
        accept=".json,application/json"
        hidden
      >
    </div>

    <div id="settingsStatus" class="status" role="status"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
